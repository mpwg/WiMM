[package]
name = "wimm-desktop"
version = "0.0.0"
description = "WhereIsMyMoney-Desktopanwendung"
authors = ["WhereIsMyMoney contributors"]
edition = "2024"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
base64 = "=0.23.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
url = "=2.5.8"
tempfile = "=3.27.0"

wimm-local-contracts = { path = "../../../crates/local-contracts" }

wimm-finance-core = { path = "../../../crates/finance-core" }

[lints.rust]
unsafe_code = "forbid"
