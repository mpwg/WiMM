[package]
name = "wimm-desktop"
version = "0.0.0"
description = "WhereIsMyMoney-Desktopanwendung"
authors = ["WhereIsMyMoney contributors"]
edition = "2024"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
url = "=2.5.8"
tempfile = "=3.27.0"

[dev-dependencies]
wimm-finance-core = { path = "../../../crates/finance-core" }
