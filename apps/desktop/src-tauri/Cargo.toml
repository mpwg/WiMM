[package]
name = "wimm-desktop"
version = "0.0.0"
description = "WhereIsMyMoney-Desktopanwendung"
authors = ["WhereIsMyMoney contributors"]
edition = "2024"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
url = "=2.5.8"
tempfile = "=3.27.0"

wimm-finance-types = { path = "../../../crates/finance-types" }
wimm-local-dal = { path = "../../../crates/local-dal", features = ["sqlite"] }
wimm-local-runtime = { path = "../../../crates/local-runtime" }
wimm-client-application = { path = "../../../crates/client-application" }
wimm-client-crypto = { path = "../../../crates/client-crypto" }

wimm-local-contracts = { path = "../../../crates/local-contracts" }

wimm-finance-core = { path = "../../../crates/finance-core" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
