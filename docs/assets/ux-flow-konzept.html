<style>

ween;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}#wimm-flow .action{padding:10px 16px;border:1px solid var(--wm-line);border-radius:9px;background:var(--wm-paper);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}#wimm-flow .primary{background:var(--wm-accent);color:var(--wm-on);border-color:var(--wm-accent)}#wimm-flow .quiet{background:transparent;border:0;color:var(--wm-accent);padding:8px 0;text-align:left}#wimm-flow .number{font-variant-numeric:tabular-nums;white-space:nowrap}#wimm-flow .hero{padding:23px 26px;background:var(--wm-soft);border-radius:14px;margin-bottom:28px}#wimm-flow .big{font-size:42px;line-height:1.2;font-weight:500;letter-spacing:-1.5px;margin:8px 0}#wimm-flow .hero-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:17px}#wimm-flow .columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(190px,1fr);gap:28px}#wimm-flow .row{display:flex;gap:13px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--wm-line)}#wimm-flow .row:first-child{padding-top:0}#wimm-flow .end{text-align:right}#wimm-flow .symbol{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--wm-paper);flex-shrink:0}#wimm-flow .description{flex:1;min-width:0}#wimm-flow .pill{background:var(--wm-soft);color:var(--wm-accent);font-size:12px;border-radius:5px;padding:3px 7px;display:inline-block}#wimm-flow .notice{border-left:3px solid var(--wm-accent);padding:8px 14px;margin:18px 0;background:var(--wm-paper)}#wimm-flow .form{max-width:500px;margin:0 auto}#wimm-flow .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}#wimm-flow .field{display:grid;gap:6px;margin-bottom:17px;color:var(--wm-muted)}#wimm-flow input,#wimm-flow .field select{width:100%;min-width:0;background:var(--wm-paper);color:var(--wm-text);border:1px solid var(--wm-line);border-radius:9px;padding:11px 12px}#wimm-flow input.amount{font-size:36px;letter-spacing:-1px}#wimm-flow .segment{display:flex;gap:6px;margin-bottom:22px}#wimm-flow .segment button{flex:1;border:1px solid var(--wm-line);background:var(--wm-paper);border-radius:8px;padding:10px}#wimm-flow .segment button[aria-pressed=true]{background:var(--wm-soft);border-color:var(--wm-accent);color:var(--wm-accent)}#wimm-flow .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}#wimm-flow .form .actions button.primary{flex:1}#wimm-flow .steps{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--wm-muted);margin-bottom:25px}#wimm-flow .steps b{color:var(--wm-accent);font-weight:500}#wimm-flow .meter{height:6px;background:var(--wm-line);border-radius:10px;margin:9px 0 18px;overflow:hidden}#wimm-flow .meter span{display:block;height:100%;background:var(--wm-accent)}#wimm-flow .group{margin-top:24px}#wimm-flow .budgetrow{padding:14px 0;border-bottom:1px solid var(--wm-line)}#wimm-flow .budgetrow .row{padding:0;border:0}#wimm-flow .budgetrow .meter{margin-bottom:0}#wimm-flow .check{display:flex;align-items:flex-start;gap:10px;margin:18px 0}#wimm-flow .check input{width:18px;min-height:18px;flex-shrink:0;margin-top:2px}#wimm-flow .success{font-size:21px;margin:20px 0;color:var(--wm-accent)}#wimm-flow .error{color:var(--wm-error)}#wimm-flow .welcome{max-width:490px;margin:35px auto}#wimm-flow .welcome h1{font-size:38px}#wimm-flow .choice{width:100%;display:flex;align-items:center;text-align:left;justify-content:space-between;padding:19px;background:var(--wm-paper);border:1px solid var(--wm-line);border-radius:12px;margin:12px 0}#wimm-flow .choice.selected{border-color:var(--wm-accent);background:var(--wm-soft)}#wimm-flow .mobilebar,#wimm-flow .mobile-scope{display:none}
@media(max-width:760px){#wimm-flow .shell{grid-template-columns:1fr}#wimm-flow aside{display:none}#wimm-flow main{padding:23px 20px;min-height:560px}#wimm-flow .columns{grid-template-columns:1fr;gap:26px}#wimm-flow header{padding:13px 100px 13px 20px}#wimm-flow .meta,#wimm-flow .desktop-title{display:none}#wimm-flow .mobile-scope{display:block;max-width:190px}#wimm-flow .mobilebar{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-around;border-top:1px solid var(--wm-line);background:var(--wm-paper);padding:8px}#wimm-flow .mobilebar button{border:0;background:transparent;border-radius:8px;padding:10px 8px;font-size:12px;min-height:44px}#wimm-flow .big{font-size:36px}#wimm-flow .fieldgrid{grid-template-columns:1fr}#wimm-flow .head{margin-bottom:20px}#wimm-flow .hero{padding:20px}#wimm-flow .welcome{margin:15px auto}#wimm-flow .welcome h1{font-size:31px}}
@media(pointer:coarse){#wimm-flow button{min-height:44px}#wimm-flow input,#wimm-flow select{font-size:16px}}

<div id="wimm-flow" aria-label="WhereIsMyMoney – modernes UX-Konzept">
 <div class="shell">
  <aside><div class="brand">Wi<span>MM.</span></div><label><span class="small">Finanzbereich</span><select class="scope" aria-label="Finanzbereich"><option value="private">Privat · Alex</option><option value="home">Haushalt · Zuhause</option></select></label><nav class="navigation" aria-label="Hauptnavigation"><button class="cursor-interaction" data-go="overview" aria-current="page"><i data-lucide="house" aria-hidden="true"></i>Übersicht</button><button class="cursor-interaction" data-go="transactions"><i data-lucide="list" aria-hidden="true"></i>Buchungen</button><button class="cursor-interaction" data-go="budget"><i data-lucide="wallet" aria-hidden="true"></i>Budget</button><button class="cursor-interaction" data-go="household" hidden><i data-lucide="users" aria-hidden="true"></i>Ausgleich</button><button class="cursor-interaction" data-go="accounts"><i data-lucide="landmark" aria-hidden="true"></i>Konten</button></nav><div class="sidefoot"><button class="action cursor-interaction" data-go="start">Einstieg ansehen</button><button class="quiet cursor-interaction" data-go="states">Tresor & Datenstatus</button><span class="small">Lokal auf diesem Gerät</span></div></aside>
  <div class="work"><header><span class="desktop-title">Privat · Alex</span><select class="scope mobile-scope" aria-label="Finanzbereich mobil"><option value="private">Privat · Alex</option><option value="home">Haushalt · Zuhause</option></select><span class="meta">Konzept · Beispieldaten</span></header><main aria-live="polite"></main><nav class="mobilebar" aria-label="Mobile Navigation"><button class="cursor-interaction" data-go="overview">Übersicht</button><button class="cursor-interaction" data-go="transactions">Buchungen</button><button class="cursor-interaction" data-go="budget">Budget</button><button class="cursor-interaction" data-go="more">Mehr</button></nav></div>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('wimm-flow'),main=root.querySelector('main');
 const state={screen:'overview',scope:'private',direction:'Ausgabe',method:'equal',reimbursement:'participants',recorded:false,shared:false,settled:false,assigned:{private:false,home:false},entry:{amount:'86,40',payee:'BILLA',category:'Lebensmittel',account:'Girokonto',date:'2026-10-05'}};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=c=>new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'}).format(c/100);
 function cents(){const value=state.entry.amount.trim();if(!/^\d{1,8}(,\d{1,2})?$/.test(value))return null;const[a,b='']=value.split(',');return Number(a)*100+Number(b.padEnd(2,'0'))}
 const btn=(text,go,primary=false)=>`<button type="button" class="action ${primary?'primary ':''}cursor-interaction" data-go="${go}">${text}</button>`;
 const head=(title,subtitle,action='')=>`<div class="head"><div><div class="kicker">${subtitle}</div><h1>${title}</h1></div>${action}</div>`;
 const row=(name,detail,value,icon='shopping-bag')=>`<div class="row"><span class="symbol"><i data-lucide="${icon}" aria-hidden="true"></i></span><div class="description"><strong>${name}</strong><div class="small">${detail}</div></div><strong class="number end">${value}</strong></div>`;
 const steps=(current,labels)=>`<div class="steps">${labels.map((x,i)=>`${i?'→ ':''}${i===current?'<b>':''}${x}${i===current?'</b>':''}`).join(' ')}</div>`;
 const field=(label,name,value,extra='')=>`<label class="field">${label}<input name="${name}" value="${esc(value)}" ${extra}></label>`;
 function iconize(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'Ruhige Finanzübersicht',screen:state.screen,scope:state.scope},privateContent:null}).catch(()=>{})}
 function show(screen){state.screen=screen;render();save()}
 function render(){
 const {screen,scope,entry,assigned}=state,priv=scope==='private',amount=cents()??8640;
 const alex=state.method==='equal'?Math.ceil(amount/2):Math.ceil(amount*3/4),sam=amount-alex;
 const unassigned=assigned[scope]?0:priv?60000:45000,accountBalance=priv?342000:210000;
 const context=priv?'PRIVAT · ALEX':'HAUSHALT · ZUHAUSE';
 const transactions=priv?row(state.recorded?esc(entry.payee):'BILLA','Heute · '+esc(state.recorded?entry.category:'Lebensmittel')+' · Girokonto',(state.direction==='Ausgabe'?'−':'+')+money(amount))+row('dm','4. Okt. · Drogerie · Girokonto','−24,80 €')+row('Stadtwerke','2. Okt. · Wohnen · Girokonto','−78,00 €','zap')+row('Gehalt','1. Okt. · Einnahmen · Girokonto','+2.800,00 €','arrow-down-left'):row('Internet','4. Okt. · Wohnen · Haushaltskonto','−39,90 €')+row('Miete','1. Okt. · Wohnen · Haushaltskonto','−950,00 €','house')+row('Beitrag Sam','1. Okt. · Beitrag · Haushaltskonto','+1.000,00 €','arrow-down-left');
 root.querySelectorAll('.scope').forEach(el=>el.value=scope);root.querySelector('.desktop-title').textContent=priv?'Privat · Alex':'Haushalt · Zuhause';
 root.querySelector('.navigation [data-go="household"]').hidden=priv;
 root.querySelectorAll('nav [data-go]').forEach(b=>{if(b.dataset.go===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(screen==='overview')main.innerHTML=head('Alles im Blick.',priv?'DEIN OKTOBER':'EUER OKTOBER',btn('＋ Buchung','entry',true))+`<section class="hero"><div>Noch nicht im Budget zugewiesen</div><div class="big number">${money(unassigned)}</div><span class="muted">Bereits vorhandenes Geld · Umschlagbudget</span><div class="hero-foot"><span class="small">Kontostand gesamt: ${money(accountBalance)}</span>${btn('Geld einplanen →','budget')}</div></section><div class="columns"><section><h2>Letzte Buchungen</h2>${transactions}<button class="quiet cursor-interaction" data-go="transactions">Alle Buchungen ansehen →</button></section><section><h2>Als Nächstes</h2><div class="row"><div><strong>Internet</strong><div class="small">Am 8. Oktober · Zahlungsvorschlag</div></div><span class="number">39,90 €</span></div><p class="small">Vorschläge werden erst nach Bestätigung gebucht.</p>${btn('Vorschlag prüfen','due')}<div class="group"><h2>${priv?'Dein Budget':'Gemeinsame Kosten'}</h2><p class="muted">${priv?'Lebensmittel: '+(assigned[scope]?'313,60 €':'213,60 €')+' übrig.':'Kosten teilen und tatsächliche Zahlungen nachvollziehen.'}</p>${btn(priv?'Budget öffnen':'Ausgleich öffnen',priv?'budget':'household')}</div></section></div>`;
 else if(screen==='transactions')main.innerHTML=head('Buchungen',context,btn('＋ Buchung','entry',true))+`<div class="head"><label class="field" style="margin:0;flex:1"><span class="small">Empfänger suchen</span><input id="wm-search" placeholder="Buchungen durchsuchen"></label>${btn('Importieren','import')}</div><section id="wm-list">${transactions}</section><div id="wm-empty" class="notice" hidden>Keine Buchungen zu dieser Suche.</div><div class="actions">${priv?btn(esc(entry.payee)+': Details öffnen','detail'):btn('Gemeinsame Kosten ansehen','household')}</div>`;
 else if(screen==='detail')main.innerHTML=`<div class="form">${head(esc(entry.payee),'BUCHUNGSDETAILS')}<div class="big number">−${money(amount)}</div>${row(esc(entry.category),'5. Oktober 2026 · '+esc(entry.account),'','tag')}<div class="notice">Diese Buchung ist privat. Der Haushalt sieht sie erst, wenn du eine gemeinsame Ausgabe bestätigst.</div><div class="actions">${btn('Zurück','transactions')}${btn('Mit Haushalt teilen','share',true)}</div></div>`;
 else if(screen==='entry')main.innerHTML=`<div class="form">${steps(0,['Erfassen','Speichern','Optional teilen'])}${head('Neue Buchung',context)}<form id="wm-entry"><div class="segment"><button type="button" class="cursor-interaction" data-direction="Ausgabe" aria-pressed="${state.direction==='Ausgabe'}">Ausgabe</button><button type="button" class="cursor-interaction" data-direction="Einnahme" aria-pressed="${state.direction==='Einnahme'}">Einnahme</button></div>${field('Betrag in EUR','amount',entry.amount,'class="amount number" inputmode="decimal" required')}${field('Empfänger','payee',entry.payee)}<div class="fieldgrid"><label class="field">Konto<select name="account">${priv?'<option>Girokonto</option><option>Bargeld</option>':'<option>Haushaltskonto</option>'}</select></label>${field('Datum','date',entry.date,'type="date" required')}</div><label class="field">Kategorie<select name="category"><option>Lebensmittel</option><option>Freizeit</option><option>Wohnen</option><option>Einnahmen</option></select></label><details><summary class="cursor-interaction">Notiz hinzufügen</summary>${field(priv?'Private Notiz':'Gemeinsame Notiz','note',entry.note??'')}</details><p id="wm-error" class="error" role="alert" hidden></p><div class="actions">${btn('Abbrechen','transactions')}<button type="submit" class="action primary cursor-interaction">Buchung speichern</button></div></form></div>`;
 else if(screen==='saved')main.innerHTML=`<div class="form">${steps(1,['Erfassen','Speichern','Optional teilen'])}<div class="success">✓ Buchung erfasst</div><h1>${money(amount)}</h1><p>${esc(entry.payee)} · ${esc(entry.category)}</p><div class="notice">${priv?'Privat · Alex. Du entscheidest, ob gemeinsame Kosten daraus entstehen.':'Haushalt · Zuhause. Diese Buchung gehört zum gemeinsamen Bereich.'}</div><div class="actions">${btn('Zur Buchungsliste','transactions')}${priv&&state.direction==='Ausgabe'?btn('Mit Haushalt teilen →','share',true):''}</div><p class="small" style="margin-top:22px">Klickprototyp · keine dauerhafte Speicherung</p></div>`;
 else if(screen==='share')main.innerHTML=`<div class="form">${steps(0,['Anteile festlegen','Freigabe prüfen','Teilen'])}${head('Gemeinsam getragen.','PRIVAT → HAUSHALT · ZUHAUSE')}<p>${esc(entry.payee)} · <strong class="number">${money(amount)}</strong> · Alex hat privat bezahlt</p><label class="field">Wie verteilt ihr die Kosten?<select id="wm-method"><option value="equal">Gleich aufteilen · 50 / 50</option><option value="weights">Nach Gewichten · 3 / 1</option></select></label>${row('Alex',state.method==='equal'?'50 %':'75 %',money(alex),'user')}${row('Sam',state.method==='equal'?'50 %':'25 %',money(sam),'user')}<label class="field" style="margin-top:20px">Wer erstattet die Vorleistung?<select id="wm-reimbursement"><option value="participants">Personen untereinander</option><option value="household">Aus dem Haushaltskonto</option></select></label><p class="small">${state.reimbursement==='participants'?'Keine Reserve im gemeinsamen Budget. Sam gleicht den eigenen Anteil mit Alex aus.':money(amount)+' werden als offene Vorleistung im Haushaltsbudget reserviert. Eine spätere Erstattung zählt nicht erneut als Ausgabe.'}</p><div class="actions">${btn('Zurück','saved')}${btn('Freigabe prüfen →','review',true)}</div></div>`;
 else if(screen==='review')main.innerHTML=`<div class="form">${steps(1,['Anteile festlegen','Freigabe prüfen','Teilen'])}${head('Das sieht euer Haushalt.','VORSCHAU DER FREIGABE')}<section class="hero"><h2>${esc(entry.payee)}</h2><div class="big number">${money(amount)}</div><p>${esc(entry.category)} · ${new Intl.DateTimeFormat('de-AT',{dateStyle:'long',timeZone:'UTC'}).format(new Date(entry.date+'T12:00:00Z'))}</p><div class="row"><span>Bezahlt von</span><strong>Alex · privat</strong></div><div class="row"><span>Alex / Sam</span><strong class="number">${money(alex)} / ${money(sam)}</strong></div><div class="row"><span>Erstattung</span><strong>${state.reimbursement==='participants'?'Unter Personen':'Haushaltskonto'}</strong></div></section><div class="notice">Dein privates Konto, dein Kontostand und deine privaten Notizen werden nicht geteilt.</div><div class="actions">${btn('Anteile ändern','share')}<button class="action primary cursor-interaction" data-action="publish">Ausgabe teilen</button></div></div>`;
 else if(screen==='published')main.innerHTML=`<div class="form">${steps(2,['Anteile festlegen','Freigabe prüfen','Teilen'])}<div class="success">✓ Gemeinsame Ausgabe freigegeben</div><h1>Jeder Anteil ist klar.</h1><p>Alex: ${money(alex)} · Sam: ${money(sam)}</p><p class="muted">Die private Buchung bleibt in deinem Bereich. Im Haushalt erscheint die bestätigte gemeinsame Ausgabe.</p><div class="actions">${btn('Zur privaten Übersicht','private')}${btn('Im Haushalt ansehen →','household',true)}</div></div>`;
 else if(screen==='budget'){
 const add=assigned[scope];const envelopes=priv?[['Lebensmittel',add?40000:30000,add?31360:21360],['Wohnen',120000,94640],['Freizeit',add?30000:20000,add?26000:16000],['Rücklagen',add?190000:150000,add?190000:150000]]:[['Lebensmittel',add?40000:30000,add?25000:15000],['Wohnen',120000,90000],['Freizeit',add?30000:20000,add?20000:10000],['Rücklagen',add?75000:50000,add?75000:50000]];
 main.innerHTML=head('Geld mit einem Plan.','OKTOBER 2026 · UMSCHLAGBUDGET')+`<section class="hero"><div>Noch zuzuweisen</div><div class="big number">${money(unassigned)}</div><p class="small">Bereits vorhandenes Geld. Erwartetes Gehalt ist nicht enthalten.</p>${add?'<span class="pill">Alles zugewiesen</span>':btn(priv?'600 € verteilen':'450 € verteilen','assign')}</section><h2>${priv?'Deine':'Eure'} Umschläge</h2>${envelopes.map(([name,assigned,available])=>`<div class="budgetrow"><div class="row"><div><strong>${name}</strong><div class="small">Zugewiesen: ${money(assigned)}</div></div><div class="end"><strong class="number">${money(available)}</strong><div class="small">übrig</div></div></div><div class="meter" role="img" aria-label="${Math.round((assigned-available)*100/assigned)} Prozent verbraucht"><span style="width:${(assigned-available)*100/assigned}%"></span></div></div>`).join('')}<div class="actions">${btn('Planbudget vergleichen','plan')}</div><p class="small" style="margin-top:18px">Eigenständiger Budgetentwurf mit Beispieldaten.</p>`;
 }
 else if(screen==='assign')main.innerHTML=`<div class="form">${head('Jedem Euro eine Aufgabe.','BUDGET · OKTOBER')}<p>Du kannst ${money(unassigned)} verteilen.</p>${row('Lebensmittel','Zusätzliche Zuweisung','100,00 €')}${row('Freizeit','Zusätzliche Zuweisung','100,00 €','coffee')}${row('Rücklagen','Zusätzliche Zuweisung',priv?'400,00 €':'250,00 €','wallet')}<div class="notice">Zuweisen bewegt Geld im Budget und erzeugt keine Kontobuchung.</div><div class="actions">${btn('Zurück','budget')}<button class="action primary cursor-interaction" data-action="assign">Verteilung bestätigen</button></div></div>`;
 else if(screen==='assigned')main.innerHTML=`<div class="form"><div class="success">✓ Geld eingeplant</div><h1>${priv?'600,00 €':'450,00 €'} verteilt.</h1><p>Lebensmittel +100,00 € · Freizeit +100,00 € · Rücklagen +${priv?'400,00 €':'250,00 €'}</p><p class="muted">Es bleiben 0,00 € nicht zugewiesen. Der Kontostand bleibt gleich.</p>${btn('Zum Budget','budget',true)}</div>`;
