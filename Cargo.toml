# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/finance-core", "crates/finance-bindings", "tools/ffi-bindgen", "tools/core-probe", "tools/wasm-glue", "tools/dal-proof", "tools/contract-schema"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = "=1.27.0"
uniffi = "=0.32.2"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
