[package]
name = "wimm-core-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
contract-schema = ["wimm-client-application/contract-schema", "dep:schemars", "wimm-finance-types/contract-schema"]
default = ["native"]
native = ["wimm-client-application/native-bindings", "wimm-local-contracts/native-bindings", "wimm-public-contracts/native-bindings", "dep:uniffi", "wimm-finance-types/native-bindings"]
wasm = ["wimm-client-application/wasm-bindings", "wimm-contract-primitives/wasm-data", "wimm-local-contracts/wasm-bindings", "wimm-public-contracts/wasm-bindings", "dep:wasm-bindgen", "dep:tsify", "dep:js-sys", "wimm-finance-types/wasm-bindings"]
contract-probe = ["dep:wimm-client-crypto","wimm-finance-core/contract-probe"]

[dependencies]
sha2 = "=0.11.0"
wimm-client-crypto = { path = "../client-crypto", optional = true }
wimm-client-application = { path = "../client-application" }
schemars = { version = "=1.2.2", optional = true }
wimm-contract-primitives = { path = "../contract-primitives" }
wimm-local-contracts = { path = "../local-contracts" }
wimm-public-contracts = { path = "../public-contracts" }
wimm-finance-core = { path = "../finance-core" }
wimm-finance-types = { path = "../finance-types" }
uniffi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
tsify = { version = "=0.5.8", default-features = false, features = ["json"], optional = true }
js-sys = { version = "=0.3.106", optional = true }

[lints]
workspace = true

[dev-dependencies]
wimm-local-dal = { path = "../local-dal", features = ["sqlite"] }
wimm-client-crypto = { path = "../client-crypto" }

[[bin]]
name = "wimm-stateful-probe"
path = "src/bin/stateful-probe.rs"
required-features = ["native", "contract-probe"]
