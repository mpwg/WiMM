[package]
name = "wimm-core-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native"]
native = ["wimm-public-contracts/native-bindings", "dep:uniffi", "wimm-finance-types/native-bindings"]
wasm = ["wimm-public-contracts/wasm-bindings", "dep:wasm-bindgen", "dep:tsify", "dep:js-sys", "wimm-finance-types/wasm-bindings"]
contract-probe = ["wimm-finance-core/contract-probe"]

[dependencies]
wimm-public-contracts = { path = "../public-contracts" }
wimm-finance-core = { path = "../finance-core" }
wimm-finance-types = { path = "../finance-types" }
uniffi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
tsify = { version = "=0.5.8", default-features = false, features = ["json"], optional = true }
js-sys = { version = "=0.3.106", optional = true }

[lints]
workspace = true
