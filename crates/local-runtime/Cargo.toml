serde_json.workspace = true
diesel = { version = "=2.3.13", default-features = false, features = ["sqlite","32-column-tables"] }
[dev-dependencies]
wimm-finance-core = { path = "../finance-core" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
[lints]
workspace = true
