name: Prüfung

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prüfung-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Kaltöffnung und warme Listenreaktion mit 50.000 Buchungen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7
      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Abhängigkeiten und tatsächlichen Browser einrichten
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Beide Leistungsfälle ohne gelockerte Grenze prüfen
        run: pnpm test:ui:performance
      - name: Messungen und Browserbelege sichern
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: leistungsbelege-50000
          path: |
            test-results/p4-6-matrix.json
            test-results/p4-6-matrix/
          if-no-files-found: error
          retention-days: 7
  dal-proof:
    name: DAL01 und lokale Operationsreceipts auf nativer SQLite und drei Browsern
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7
      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Native Driver- und WASM-Werkzeuge einrichten
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang llvm libssl-dev pkg-config build-essential
          rustup target add wasm32-unknown-unknown
      - name: Rust-Artefakte cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> test-results/dal-proof/native-drivers
      - name: Abhängigkeiten und drei Browser einrichten
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Tatsächliche DAL01-Prüfung
        run: pnpm test:dal:proof
      - name: Dauerhafte lokale Operationsreceipts prüfen
        run: pnpm test:storage:receipts
      - name: DAL01-Belege sichern
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dal01-native-browser-belege
          path: |
            test-results/dal-proof/browser/
            test-results/ar04/browser/
          if-no-files-found: ignore
          retention-days: 7
  ubuntu:
    name: Prüfung auf Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Tauri-Systempakete einrichten
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust einrichten
        run: |
          rustup show active-toolchain
          pnpm check:rust-toolchain
          rustup target add wasm32-unknown-unknown

      - name: Rust-Abhängigkeiten und Buildartefakte cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Abhängigkeiten gesperrt installieren
        run: pnpm install --frozen-lockfile

      - name: Playwright-Browser und Systemabhängigkeiten einrichten
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Projekt prüfen
        run: pnpm check:ci

      - name: Fehlerberichte und Browseraufzeichnungen sichern
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prüfberichte-ubuntu
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
