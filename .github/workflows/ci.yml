name: Prüfung

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prüfung-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Prüfung auf Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Tauri-Systempakete einrichten
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust einrichten
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Abhängigkeiten gesperrt installieren
        run: pnpm install --frozen-lockfile

      - name: Projekt prüfen
        run: pnpm check:ci
