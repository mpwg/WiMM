name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NUXT_SESSION_PASSWORD: ci-session-password-at-least-32-characters
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: cp deploy/access.example.json deploy/access.json
      - run: bun run db:migrate
      - run: bun run build
      - run: bunx --bun --no-install playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: docker build -t wimm:ci .
